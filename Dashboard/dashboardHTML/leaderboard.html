    <table id="leaderboard">
        <tr>
            <th>Position</th>
            <th>Name</th>
            <th>Total points</th>
            <th>Weeks points</th>
        </tr>
    </table>

<script>
const data = [
    { position: 1, name: "Flo", total: 120, week: 40 },
    { position: 2, name: "Uzair", total: 110, week: 45 },
    { position: 3, name: "Daniyal", total: 90, week: 35 },
    { position: 4, name: "Ahmed", total: 85, week: 29},
    { position: 5, name: "Aryan", total: 70, week: 46}
];

const table = document.getElementById("leaderboard");

data.forEach(player => {
    const row = table.insertRow();

    row.insertCell().textContent = player.position;
    row.insertCell().textContent = player.name;
    row.insertCell().textContent = player.total;
    row.insertCell().textContent = player.week;
});
</script>
