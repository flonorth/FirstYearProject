<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width = device-width, initial-scale = 1.0">
        <title>
            Quizzes page
        </title>
        <link rel="stylesheet" href="../dashboardCSS/quizStyles.css">
    </head>
   

    <body>
        <div class="top-panel">
            <span class="panel-title">QUIZ</span>
        </div>
        
        <div class="container">
            <h2 style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif"><strong>Choose Category</strong></h2>
            <div class="button-row">
                <button type="button" class = "button" onclick="showteamPopup()" style = "background-image: url(https://static.standard.co.uk/2021/04/19/13/europeansuperleague190421v2-1.jpg?width=1200);
            background-size:contain">Team</button>
                <button type="button" class="button" onclick="showplayerPopup()" style= "background-image: url(https://i.guim.co.uk/img/media/5e90a3850dc6aece800d43d284430b807edcde95/415_0_4528_3623/master/4528.jpg?width=465&dpr=1&s=none&crop=none);
            background-size: contain">Player</button>
            </div>
        </div>

        <div id = "team_pop-up" class="overlay">
            <h2 style="text-align: center;">Select Team</h2>

            <input type="text" placeholder="Search Team..." oninput="filterList(this, 'teamList')"> <!-- 'this' refers to the input box itself -->
            <div class="items-grid" id="teamList"> 
                <div class="item" onclick="startQuiz()">Manchester United</div>
                <div class="item">Manchester City</div>
                <div class="item">Liverpool</div>
                <div class="item">Chelsea</div>
                <div class="item">Arsenal</div>
                <div class="item">Tottenham</div>
            </div>
            <button class = "back_button" onclick="hidePopup('team_pop-up')">Back</button>
        </div>
        <div id = "player_pop-up" class="overlay">
            <h2 style="text-align: center;">Select Player</h2>
    
            <input type="text" placeholder="Select Player" oninput="filterList(this, 'playerList')">
        <div class="items-grid" id="playerList">
            <div class = "item">Haaland</div>
            <div class = "item">Bernardo Silva</div>
            <div class = "item">Semenyo</div>
            <div class = "item">Ruben Dias</div>
            <div class = "item">Rodri</div>
            <div class = "item">Donnarumma</div>
            <div class = "item">Jeremy Doku</div>
            <div class = "item">Rayan Cherki</div>
            <div class = "item">Omar Marmoush</div>
        </div>
            <button class = "back_button" onclick="hidePopup('player_pop-up')">Back</button>
        </div>

        <div class = "overlay2" id = "Quizscreen">
            <h2>Welcome to the quiz page</h2>
        </div>
        <script src="quizzes.js"></script>
    </body>
</html>
