<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width = device-width, initial-scale = 1.0">
        <title>
            Quizzes page
        </title>
    </head>
    <style>
        html{
            font-size: 100% ;
        }
        h1 {border: solid black;
            border-left: none;
            margin-top: 0; /* remove top margin (whitespace) */ 
            text-align: center;
            font-size: 2.5rem;
            background-color: blueviolet;
        }


        body{
            margin: 0; /* remove space from body*/ 
            padding: 0;
        }
 
        .container{
            display: flex; /* Turns the element into a flex container */

            flex-direction: column; /* By default it's flex-direction:  row; */

            align-items: center;       /* centre items horizontally */
            justify-content: flex-start;   /* start from top */ 

            height: 100vh; /* Height set to size of screen (makes .container box size of screen) */
            padding-top: 8vh; /* pushes everything down */
        }
        h2 {
            font-size: 2rem;
            margin-bottom: 10vh;  /* space between heading and buttons*/
        }

        .button-row {
            display: flex;
            flex-direction: row;
            gap: 20vh;
        }

        .button {
            border-radius: 50px;
            height: 35vh;
            width: 40vh;
            font-size: 1.5rem;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            font-weight: bold;
        }
        
        .button:hover{
            box-shadow: 0 0 15px blueviolet;
        }

        .button:active{
            background-color: blueviolet;
        }

        .overlay{
            visibility: hidden;
            position: fixed; /* Creates the pop-up. Other elements are unaffected and slide underneath*/
            top: 50%; /* vertical center */
            left: 50%; /* horizontal center */
            transform: translate(-50%, -50%); 
            background-color: green;
            width: 100vh;
            height: 80vh;
            border-radius: 50px;
        }
    </style>

    <body>
        <h1>Quiz</h1>
        <div class="container" id="mainpage">
            <h2 style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif"><strong>Choose Category</strong></h2>
            <div class="button-row">
                <button type="button" class = "button" onclick="showPopup()" style = "background-image: url(https://static.standard.co.uk/2021/04/19/13/europeansuperleague190421v2-1.jpg?width=1200);
            background-size:contain">Team</button>
                <button type="button" class="button" onclick="showPopup()" style= "background-image: url(https://i.guim.co.uk/img/media/5e90a3850dc6aece800d43d284430b807edcde95/415_0_4528_3623/master/4528.jpg?width=465&dpr=1&s=none&crop=none);
            background-size: contain">Player</button>
            </div>
        </div>

        <div id = "pop-up" class="overlay">
            <h2 style="text-align: center;">Hello!</h2>
            
        </div>

        <script src="quizzes.js"></script>
    </body>
</html>
